services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    container_name: car_insurance_premium
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    command: >
      uvicorn app.interfaces.api.routes:app
      --host 0.0.0.0
      --port 8000
      --reload